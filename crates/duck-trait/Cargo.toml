description = "Generate duck-typing accessor traits (get / set / get_mut): declare once in _fields.rs with fields!, every struct field implements them by default under #[props] — ignore fields with #[_prop], or use the scoped #[duck] marker api."
keywords = ["proc-macro", "duck-typing", "getter", "setter", "accessor"]
